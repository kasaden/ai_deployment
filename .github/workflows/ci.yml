name: CI/CD

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test:
    name: Lint et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (pytest, vrai modèle)
        run: pytest -q

  docker:
    name: Image Docker
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t ghcr.io/kasaden/ai_deployment:${{ github.sha }} .
      - name: Smoke test de l'image
        run: |
          docker run -d --name api -p 8000:8000 ghcr.io/kasaden/ai_deployment:${{ github.sha }}
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf -X POST localhost:8000/extract -H 'Content-Type: application/json' \
            -d '{"text":"The Russian Defense Ministry said Iskander missiles hit a brigade."}'
      - name: Publication GHCR (main uniquement)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag ghcr.io/kasaden/ai_deployment:${{ github.sha }} ghcr.io/kasaden/ai_deployment:latest
          docker push ghcr.io/kasaden/ai_deployment:${{ github.sha }}
          docker push ghcr.io/kasaden/ai_deployment:latest
